name: wholesale_pos_app
description: "Wholesale point-of-sale desktop application."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+3

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Pure-Dart domain entities (Sale, Shift, User, ...), shared by the local
  # repositories, the cloud clients, sync, and the UI. Lives outside the
  # application folder so infrastructure never imports models out of the
  # presentation layer.
  pos_core:
    path: ../backend/dart/pos_core

  # Platform-independent backend contracts and interfaces.
  pos_contracts:
    path: ../backend/dart/pos_contracts

  # Cloud communication, sync transport, and cloud repository implementations.
  pos_cloud_engine:
    path: ../backend/dart/pos_cloud_engine

  # Native SQLite persistence engine.
  pos_local_engine:
    path: ../backend/dart/pos_local_engine

  # SQLite persistence with the FFI implementation used on Windows.
  sqflite_common_ffi: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  crypto: ^3.0.7
  pdf: ^3.13.1
  printing: ^5.15.1
  cryptography: ^2.9.0
  file_selector: ^1.1.0
  http: ^1.6.0
  sqflite: ^2.4.5
  # Browser localStorage + window access for the web/PWA build's session and
  # preferences. Web-only (its conditional export is a no-op off the browser),
  # so it never affects the native Windows/APK compile.
  web: ^1.1.2
  # Reads a reinstall-surviving platform id (ANDROID_ID / identifierForVendor)
  # so the licensing device fingerprint stays stable across an app uninstall.
  device_info_plus: ^13.3.0
  # Camera/gallery capture for the register's optional debit proof photos.
  # Active on Android/iOS only; desktop and web pick files via file_selector.
  image_picker: ^1.1.2
  # Pure-Dart image decode/resize/JPEG-encode. The web/PWA proof picker uses it
  # to compress a picked photo to a ledger-sized base64 JPEG (dart:ui has no
  # JPEG encoder on web). Also present transitively via `pdf`; declared direct
  # here because our own code imports it.
  image: ^4.12.0
  # Short "new picklist" chime for the warehouse queue. Plays on web, Windows
  # and Android from one asset, so the alert sounds the same on every device.
  audioplayers: ^6.8.1
  # Native Apple-style icons (money, credit-card, building-2, etc.) used across
  # the dashboard redesign. Included as a font asset here so they are baked into
  # the web bundle rather than relying on the SDK-internal transitive copy.
  cupertino_icons: ^1.0.8
  # Material/Cupertino widget libraries, decoupled from the Flutter SDK in
  # Flutter 3.50 (package:flutter/material.dart and cupertino.dart are
  # deprecated). All UI imports use these packages directly.
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.7
  # Direction B typography: Geist (body) and Geist Mono (data/monetary values).
  # The TTFs are bundled under assets/fonts and declared below, so no runtime
  # fetch or google_fonts dependency is involved.
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3
  saropa_lints: ^17.0.0
  test: ^1.31.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/sounds/warehouse_alert.wav
    - integration_test/fixtures/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Custom fonts. Declared as TTF because that is the format the Flutter
  # engine loads on Android, Windows and iOS; woff2 only decodes on web, which
  # is why the same bundle would silently fall back to the platform default on
  # the till. The `assets/fonts/` directory must not be listed under `assets:`
  # as well, or every face is bundled twice.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies, see
  # https://flutter.dev/to/font-from-package
